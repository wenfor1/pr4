<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Synth 2026 — Music Album (ПР 4)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- 1. Підключення зовнішнього JS-скрипта з атрибутом defer -->
  <script src="script.js" defer></script>

  <style>
    @font-face {
      font-family: 'AccentHeaderFont';
      src: url('fonts/header-font.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --bg-dark: #0a0e17;
      --card-bg: #131b2e;
      --accent: #00f2fe;
      --accent-hover: #4facfe;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --font-main: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
      font-family: var(--font-main);
      line-height: 1.6;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header header"
        "sidebar main"
        "player player";
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo { width: 32px; height: 32px; fill: var(--accent); }

    aside {
      grid-area: sidebar;
      background-color: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: fit-content;
    }

    .album-cover {
      width: 100%; height: 270px; object-fit: cover; border-radius: 12px;
    }

    /* Кнопка лайка */
    .like-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .like-btn.liked {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
    }

    main {
      grid-area: main;
      background-color: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .track-table { width: 100%; border-collapse: collapse; text-align: left; }
    .track-table th, .track-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
    .track-row { cursor: pointer; transition: background 0.2s; }
    .track-row:hover { background-color: rgba(255, 255, 255, 0.05); }
    .track-row.active-track { background-color: rgba(0, 242, 254, 0.1); color: var(--accent); }

    /* Форма коментарів */
    .comments-section {
      margin-top: 10px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .comment-form { display: flex; gap: 10px; margin-top: 12px; }
    .comment-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0a0e17;
      color: #fff;
    }

    .btn-submit {
      padding: 10px 16px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .comment-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 0.9rem;
    }

    footer {
      grid-area: player;
      background: rgba(19, 27, 46, 0.95);
      padding: 16px 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    audio { width: 100%; max-width: 600px; height: 40px; }
  </style>
</head>
<body>

  <div class="grid-container">
    <header>
      <svg class="brand-logo" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <h1>CyberSound Studio</h1>
    </header>

    <aside>
      <img class="album-cover" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80" alt="Neon Waves" loading="lazy">
      <div>
        <div class="album-title">Neon Waves 2026</div>
        <div class="album-artist">Synthwave Future</div>
      </div>
      <button class="like-btn" id="likeBtn">
        ❤️ Вподобати (<span id="likeCount">42</span>)
      </button>
    </aside>

    <main>
      <h2>Список треків</h2>
      <table class="track-table">
        <thead>
          <tr><th>#</th><th>Назва треку</th><th>Жанр</th><th>Тривалість</th></tr>
        </thead>
        <tbody>
          <tr class="track-row" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
            <td>▶</td><td>01. Midnight City Drive</td><td>Synthwave</td><td>03:45</td>
          </tr>
          <tr class="track-row" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
            <td>▶</td><td>02. Cybernetic Dreams</td><td>Darksynth</td><td>04:12</td>
          </tr>
          <tr class="track-row" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">
            <td>▶</td><td>03. Retro Future Sunrise</td><td>Chillwave</td><td>03:20</td>
          </tr>
        </tbody>
      </table>

      <!-- Блок відгуків / коментарів -->
      <div class="comments-section">
        <h3>Відгуки слухачів (<span id="commentCount">0</span>)</h3>
        <form class="comment-form" id="commentForm">
          <input type="text" class="comment-input" id="commentInput" placeholder="Напишіть свій відгук..." required>
          <button type="submit" class="btn-submit">Надіслати</button>
        </form>
        <div id="commentsList"></div>
      </div>
    </main>

    <footer>
      <div>
        <strong style="display:block; font-size: 0.75rem; color: var(--text-muted);">Зараз грає:</strong>
        <span id="nowPlaying" style="font-size: 0.85rem; color: var(--accent); font-weight: 600;">01. Midnight City Drive</span>
      </div>
      <audio id="mainAudio" controls>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      </audio>
    </footer>
  </div>

</body>
</html>
